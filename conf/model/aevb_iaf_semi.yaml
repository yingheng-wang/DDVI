# semi-supervised AEVB-IAF; the classification weight is cls_weight * kld_weight
name: aevb_iaf_semi
batch_size: 128
lr: 0.0001
num_epochs: 50
hidden_size: 1000
latent_size: 2
bn: false
kld_weight: 0.01        # 0.5 for CIFAR-10 (Table 8, see scripts/)
kld_schedule: constant
context_size: 10
p_weight: 1
cls_weight: 1
